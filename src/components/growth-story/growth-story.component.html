<div id="growthStory" class="why-us section-bg growth-image">
  <div class="container-fluid aos-init aos-animate">
    <div class="row">
      <div class="section-title">
        <h2 class="text-yellow">Growth Story</h2>
      </div>

      <!-- LEFT SIDE (accordion) -->
      <div class="col-lg-7 d-flex flex-column justify-content-center align-items-stretch order-2 order-lg-1">
        <div class="content">
          <strong>30+ Outlets in Thane, Mumbai, Navi Mumbai & Pune</strong>
        </div>
        <br>

        <div class="accordion-list">
          <ul>
            <li *ngFor="let item of growthStory; let i = index">
              <a data-bs-toggle="collapse"
                 class="collapse text-dark"
                 [attr.data-bs-target]="'#accordion-list-' + i">
                <span class="text-yellow">Year: {{ item.year }}</span> {{ item.summary }}
                <i class="bx bx-chevron-down icon-show"></i>
                <i class="bx bx-chevron-up icon-close"></i>
              </a>

              <div [id]="'accordion-list-' + i"
                   class="collapse"
                   [ngClass]="{ 'show': i === 0 }"
                   data-bs-parent=".accordion-list">
                <div class="accordion-body row">
                  <div class="timeline-panel col m-1"
                       *ngFor="let event of item.events">
                    <div class="timeline-heading">
                      <h5 class="timeline-title">{{ event.month }}</h5>
                      <h6 class="timeline-title">{{ event.title }}</h6>
                    </div>
                    <div class="timeline-body">
                      <p>{{ event.description }}</p>
                    </div>
                  </div>
                </div>
              </div>
            </li>
          </ul>
        </div>
      </div>

      <!-- RIGHT SIDE (images + SVG) -->
      <div class="container col-lg-5" *ngIf="!isMobile">
        <img src="assets/img/food-pics/truck.png" class="image1">
        <img src="assets/img/food-pics/shawarma-shop-animated.png" class="image2">
        <svg class="line" viewBox="0 0 650 500">
          <path #path fill="transparent" class="path"
                d="M220 500 Q 380 460, 320 320 T 350 150"
                stroke="black" stroke-width="4" fill="none" />
          <circle cx="220" cy="500" r="3" fill="#f3b318" />
          <circle cx="350" cy="150" r="3" fill="#f3b318" />
          <path fill="#f3b318" d="M12 30L6 8H30L12 30ZM12 30V2"
                class="new-path" />
        </svg>
      </div>
    </div>
  </div>
</div>
